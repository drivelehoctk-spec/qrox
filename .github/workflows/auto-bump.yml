name: Auto Bump SW Version

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'sw.js'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Bump Script
        run: node tools/bump-sw.js

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sw.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto bump SW version" && git push)
