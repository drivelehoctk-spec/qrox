<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0078d7">
<title>QRoX Mobile</title>

<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<!-- Thư viện: QR generator + QR scanner -->
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:12px;
       background:#f5f5f7;color:#222;padding-bottom:40px}
  h2{margin:0 0 8px;font-size:15px;color:#333}
  .card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;
        box-shadow:0 1px 4px #0001}
  input,button{width:100%;padding:10px;font-size:15px;margin:6px 0;
               border:1px solid #ccc;border-radius:8px;background:#fff}
  input:focus{outline:none;border-color:#0078d7}
  button{background:#0078d7;color:#fff;border:none;font-weight:600;
         cursor:pointer;transition:opacity .15s}
  button:disabled{background:#ccc;cursor:not-allowed}
  button:active:not(:disabled){opacity:.75}
  button.alt{background:#e8734a}
  button.gray{background:#999}
  .row{display:flex;gap:8px}
  .row>*{flex:1}
  #reader{width:100%;border-radius:8px;overflow:hidden}
  #preview,#qr{width:100%;border-radius:8px;margin-top:8px;display:none;background:#fff}
  #out{background:#fafafa;padding:8px;word-break:break-all;font-family:monospace;
       font-size:12px;border-radius:8px;margin-top:6px;min-height:20px;
       border:1px solid #eee;user-select:text}
  #parsed{display:none;background:#e8f8f0;border:1px solid #b8e0c8;
          border-radius:8px;padding:10px;margin:8px 0;font-size:13px}
  #parsedInfo{margin-top:6px;font-family:monospace;font-size:12px;
              white-space:pre-wrap;line-height:1.5}
  #exportRow{display:none;margin-top:8px}
  .hint{font-size:11px;color:#888;font-style:italic;margin-top:4px}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════
     CARD 1 — NGUỒN ẢNH QR
     ═══════════════════════════════════════════════════════════ -->
<div class="card">
  <h2>📷 Nguồn ảnh QR</h2>
  <div id="reader"></div>

  <div class="row">
    <button onclick="startScan()">Quét camera</button>
    <button class="alt" onclick="stopScan()">Dừng</button>
  </div>
  <div class="row">
    <button onclick="pickImage()">🖼 Chọn ảnh</button>
    <button onclick="pasteImage()">📋 Dán ảnh</button>
  </div>

  <input id="filePick" type="file" accept="image/*"
         style="display:none" onchange="loadFromFile(this)">

  <canvas id="preview"></canvas>
</div>

<!-- ═══════════════════════════════════════════════════════════
     CARD 2 — TẠO VIETQR
     ═══════════════════════════════════════════════════════════ -->
<div class="card">
  <h2>💳 Tạo VietQR</h2>

  <input id="bank"   placeholder="Mã ngân hàng / BIN (VD: 970436)"
         inputmode="numeric" autocomplete="off">
  <input id="acc"    placeholder="Số tài khoản" autocomplete="off">
  <input id="holder" placeholder="Chủ tài khoản (tuỳ chọn)" autocomplete="off">
  <input id="amt"    placeholder="Số tiền VND (tuỳ chọn — trống = QR tĩnh)"
         inputmode="numeric" autocomplete="off">
  <input id="msg"    placeholder="Nội dung CK (tuỳ chọn)" autocomplete="off">

  <div id="parsed">
    <b style="color:#007a3d">📥 QR vừa nạp</b>
    <div id="parsedInfo"></div>
    <button class="gray" onclick="resetForm()">Xoá &amp; nhập mới</button>
  </div>

  <button id="btnGen" onclick="genVietQR()" disabled>Tạo mã QR</button>

  <canvas id="qr"></canvas>
  <div id="out"></div>

  <div id="exportRow" class="row">
    <button onclick="downloadQR()">💾 Tải về</button>
    <button class="alt" onclick="copyQR(event)">📋 Sao chép</button>
  </div>
  <div class="hint">QR tĩnh khi bỏ trống Số tiền · QR động khi có Số tiền</div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   PHẦN 1 — CORE VIETQR (CRC16, TLV, Build, Parse)
   ═══════════════════════════════════════════════════════════ */

/* CRC16-CCITT (0xFFFF, poly 0x1021) — chuẩn VietQR */
function crc16(s){
  let crc = 0xFFFF, poly = 0x1021;
  for(const ch of s){
    const b = ch.charCodeAt(0);
    for(let i=0;i<8;i++){
      const bit = ((b >> (7-i)) & 1) === 1;
      const c15 = ((crc >> 15) & 1) === 1;
      crc = (crc << 1) & 0xFFFF;
      if(c15 !== bit) crc ^= poly;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4,'0');
}

/* TLV: tag(2) + length(2) + value */
function tlv(tag, val){
  return tag + String(val.length).padStart(2,'0') + val;
}

/* Xoá dấu tiếng Việt + ký tự ngoài ASCII */
function strip(s){
  return (s || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/đ/g,'d').replace(/Đ/g,'D')
    .replace(/[^\x20-\x7E]/g,'');
}

/* Parse TLV string → {tag: value} */
function parseTLV(text){
  const r = {}; let i = 0;
  while(i <= text.length - 4){
    const tag = text.substr(i, 2);
    const len = parseInt(text.substr(i+2, 2), 10);
    if(isNaN(len) || i + 4 + len > text.length) break;
    r[tag] = text.substr(i+4, len);
    i += 4 + len;
  }
  return r;
}

/* Build chuỗi VietQR */
function buildVietQR({bin, acc, holder='', amount='', content='', method='dynamic'}){
  const inner = tlv('00', bin) + tlv('01', acc);
  const merchant = tlv('38',
    tlv('00','A000000727') + tlv('01', inner) + tlv('02','QRIBFTTA')
  );
  const amtTLV = amount && +amount > 0 ? tlv('54', String(+amount)) : '';
  const add    = content ? tlv('08', strip(content)) : '';
  const addTLV = add ? tlv('62', add) : '6200';
  const mName  = holder ? tlv('59', strip(holder)) : '';
  const init   = method === 'static' ? tlv('01','12') : tlv('01','11');

  const payload = tlv('00','01') + init + merchant + tlv('53','704')
                + amtTLV + tlv('58','VN') + addTLV + mName;
  const withCrc = payload + '6304';
  return withCrc + crc16(withCrc);
}

/* Parse chuỗi VietQR → object thông tin */
function parseVietQR(text){
  if(!text || !text.startsWith('000201') || !text.includes('A000000727')) return null;
  const root = parseTLV(text);
  const out = {bankCode:'', account:'', accHolder:'', amount:'', content:''};

  const maRaw = root['38'] || root['26'];
  if(maRaw){
    const ma = parseTLV(maRaw);
    if(ma['01']){
      const inner = parseTLV(ma['01']);
      out.bankCode = inner['00'] || '';
      out.account  = inner['01'] || '';
    }
  }
  if(root['54']) out.amount    = root['54'];
  if(root['59']) out.accHolder = root['59'];
  if(root['62']){
    const s = parseTLV(root['62']);
    out.content = s['08'] || s['01'] || '';
  }
  return out;
}

/* ═══════════════════════════════════════════════════════════
   PHẦN 2 — STATE (3 trạng thái: A nhập tay · B chưa sửa · C đã sửa)
   ═══════════════════════════════════════════════════════════ */

let lastScanned   = null;   // chuỗi QR gốc (null = chưa decode)
let isEditing     = false;  // true khi user đã sửa form sau khi decode
let hasInput      = false;  // true khi có đủ Bank + Acc
let currentQRBlob = null;   // Blob PNG của QR mới nhất
let scanner       = null;   // instance html5-qrcode

const FORM_IDS = ['bank','acc','holder','amt','msg'];

/* Gọi mỗi khi 1 trong 5 ô input đổi giá trị */
function refreshState(){
  const bank = document.getElementById('bank').value.trim();
  const acc  = document.getElementById('acc').value.trim();
  hasInput = !!(bank && acc);

  if(lastScanned){
    const orig = parseVietQR(lastScanned);
    if(orig){
      isEditing = (
        bank !== orig.bankCode ||
        acc  !== orig.account  ||
        document.getElementById('holder').value.trim() !== orig.accHolder ||
        document.getElementById('amt').value.trim()    !== orig.amount    ||
        document.getElementById('msg').value.trim()    !== orig.content
      );
    }
  }
  updateButton();
}

/* Cập nhật nhãn + disabled của nút Tạo mã QR */
function updateButton(){
  const btn = document.getElementById('btnGen');
  if(!lastScanned && !isEditing)       btn.textContent = 'Tạo mã QR';
  else if(lastScanned && !isEditing)   btn.textContent = 'Tạo lại QR (không đổi)';
  else                                 btn.textContent = 'Tạo QR mới (đã sửa)';
  btn.disabled = !hasInput;
}

/* Gắn listener cho 5 ô — chạy 1 lần khi tải trang */
FORM_IDS.forEach(id=>{
  document.getElementById(id).addEventListener('input', refreshState);
});

/* ═══════════════════════════════════════════════════════════
   PHẦN 3 — NGUỒN ẢNH: CAMERA / FILE / CLIPBOARD
   ═══════════════════════════════════════════════════════════ */

/* ---- 3.1. Camera ---- */
function startScan(){
  if(scanner) return;
  scanner = new Html5Qrcode("reader");
  scanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    text => { stopScan(); handleScanned(text); },
    () => {}   // bỏ qua lỗi frame (không có QR)
  ).catch(e => alert('Không mở được camera: ' + e));
}

function stopScan(){
  if(scanner){
    scanner.stop().then(()=>{ scanner.clear(); scanner = null; });
  }
}

/* ---- 3.2. File từ thư viện ---- */
function pickImage(){
  document.getElementById('filePick').click();
}

function loadFromFile(input){
  const f = input.files[0];
  if(!f) return;
  const url = URL.createObjectURL(f);
  const img = new Image();
  img.onload = ()=>{
    drawPreview(img);
    decodeImage(img);
    URL.revokeObjectURL(url);
  };
  img.onerror = ()=> alert('Không đọc được ảnh.');
  img.src = url;
  input.value = '';   // cho phép chọn lại cùng file
}

/* ---- 3.3. Clipboard (dán ảnh) ---- */
async function pasteImage(){
  try{
    if(!navigator.clipboard || !navigator.clipboard.read){
      return alert('Trình duyệt không hỗ trợ đọc clipboard.\nDùng "🖼 Chọn ảnh" thay thế.');
    }
    const items = await navigator.clipboard.read();
    for(const it of items){
      const imgType = it.types.find(t => t.startsWith('image/'));
      if(!imgType) continue;
      const blob = await it.getType(imgType);
      const url  = URL.createObjectURL(blob);
      const img  = new Image();
      img.onload = ()=>{
        drawPreview(img);
        decodeImage(img);
        URL.revokeObjectURL(url);
      };
      img.src = url;
      return;
    }
    alert('Clipboard không có ảnh.\nHãy sao chép ảnh trước rồi thử lại.');
  }catch(e){
    alert('Không đọc được clipboard: ' + e.message +
          '\n(Bạn cần bấm "Cho phép" khi Edge hỏi.)');
  }
}

/* ---- 3.4. Preview + decode ---- */
function drawPreview(img){
  const c = document.getElementById('preview');
  const scale = Math.min(1, 400 / img.width);
  c.width  = Math.round(img.width  * scale);
  c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  c.style.display = 'block';
}

/* Decode ảnh tĩnh bằng html5-qrcode.scanFile */
function decodeImage(img){
  const tmp = new Html5Qrcode("reader");
  tmp.scanFile(img, false)
     .then(text => handleScanned(text))
     .catch(() => {
       document.getElementById('out').textContent = '❌ Không tìm thấy QR trong ảnh.';
       document.getElementById('parsed').style.display = 'none';
       lastScanned = null;
       refreshState();
     })
     .finally(()=> tmp.clear());
}

/* ═══════════════════════════════════════════════════════════
   PHẦN 4 — XỬ LÝ SAU KHI DECODE
   ═══════════════════════════════════════════════════════════ */
function handleScanned(text){
  document.getElementById('out').textContent = text;

  const info = parseVietQR(text);
  if(!info){
    // QR không phải VietQR → không đổ vào form, form giữ nguyên
    document.getElementById('parsed').style.display = 'none';
    lastScanned = null;
    refreshState();
    return;
  }

  // QR hợp lệ → đổ vào form
  lastScanned = text;
  document.getElementById('bank').value   = info.bankCode;
  document.getElementById('acc').value    = info.account;
  document.getElementById('holder').value = info.accHolder;
  document.getElementById('amt').value    = info.amount;
  document.getElementById('msg').value    = info.content;

  document.getElementById('parsedInfo').textContent =
    `Ngân hàng : ${info.bankCode}\n` +
    `Số TK     : ${info.account}\n` +
    `Chủ TK    : ${info.accHolder || '(không có)'}\n` +
    `Số tiền   : ${info.amount ? (+info.amount).toLocaleString('vi-VN') + ' ₫' : '(không có)'}\n` +
    `Nội dung  : ${info.content || '(không có)'}`;
  document.getElementById('parsed').style.display = 'block';

  refreshState();   // → nhãn "Tạo lại QR (không đổi)"
}

/* ═══════════════════════════════════════════════════════════
   PHẦN 5 — TẠO QR (dùng chung cho cả 3 trạng thái)
   ═══════════════════════════════════════════════════════════ */
async function genVietQR(){
  try{
    const payload = {
      bin:     document.getElementById('bank').value.trim(),
      acc:     document.getElementById('acc').value.trim(),
      holder:  document.getElementById('holder').value.trim(),
      amount:  document.getElementById('amt').value.replace(/\D/g,''),
      content: document.getElementById('msg').value.trim()
    };

    if(!payload.bin || !payload.acc){
      return alert('Cần nhập Mã ngân hàng và Số tài khoản.');
    }

    const qr = buildVietQR(payload);
    document.getElementById('out').textContent = qr;

    const canvas = document.getElementById('qr');
    canvas.style.display = 'block';
    await QRCode.toCanvas(canvas, qr, { width: 640, margin: 1 });

    // Lưu Blob PNG để xuất
    canvas.toBlob(b => { currentQRBlob = b; }, 'image/png');

    // Hiện 2 nút xuất
    document.getElementById('exportRow').style.display = 'flex';

  }catch(e){
    alert('Lỗi tạo QR: ' + e.message);
  }
}

/* ═══════════════════════════════════════════════════════════
   PHẦN 6 — XUẤT QR: TẢI VỀ / SAO CHÉP
   ═══════════════════════════════════════════════════════════ */

function downloadQR(){
  if(!currentQRBlob) return;
  const ts = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(currentQRBlob);
  a.download = `VietQR_${ts}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(a.href), 3000);
}

async function copyQR(ev){
  if(!currentQRBlob) return;
  try{
    if(!navigator.clipboard || !window.ClipboardItem){
      return alert('Trình duyệt không hỗ trợ sao chép ảnh.\nDùng "💾 Tải về" thay thế.');
    }
    const item = new ClipboardItem({ 'image/png': currentQRBlob });
    await navigator.clipboard.write([item]);
    flashButton(ev.target, 'Đã sao chép ✓');
  }catch(e){
    alert('Không sao chép được: ' + e.message +
          '\n(Bạn cần bấm "Cho phép" khi Edge hỏi.)');
  }
}

/* Feedback tạm thời trên nút */
function flashButton(btn, msg){
  const old = btn.textContent;
  btn.textContent = msg;
  btn.disabled = true;
  setTimeout(()=>{ btn.textContent = old; btn.disabled = false; }, 1200);
}

/* ═══════════════════════════════════════════════════════════
   PHẦN 7 — RESET
   ═══════════════════════════════════════════════════════════ */
function resetForm(){
  FORM_IDS.forEach(id => document.getElementById(id).value = '');
  document.getElementById('out').textContent = '';
  document.getElementById('parsed').style.display = 'none';
  document.getElementById('qr').style.display = 'none';
  document.getElementById('qr').getContext('2d').clearRect(0, 0, 640, 640);
  document.getElementById('exportRow').style.display = 'none';
  document.getElementById('preview').style.display = 'none';

  lastScanned   = null;
  isEditing     = false;
  hasInput      = false;
  currentQRBlob = null;

  refreshState();
}

/* ═══════════════════════════════════════════════════════════
   PHẦN 8 — KHỞI TẠO
   ═══════════════════════════════════════════════════════════ */
refreshState();   // nút ban đầu disabled

/* Đăng ký Service Worker (offline) */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
